name: Publicación de Versión (Firma y Release)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    env:
      RELEASE_VERSION: v1.0.${{ github.run_number }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Compilar, Firmar y Empaquetar
        shell: pwsh
        env:
          MY_GITHUB_SECRET_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          ./.deploys/BUILD_AND_SIGN.ps1

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *-Windows.zip
            *.zip
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
