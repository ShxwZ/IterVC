name: Publicación de Versión (Firma y Release)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    env:
      RELEASE_VERSION: v1.0.${{ github.run_number }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar, Firmar y Empaquetar
        shell: pwsh
        env:
          MY_GITHUB_SECRET_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          ./.deploys/BUILD_AND_SIGN.ps1

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *-Windows.zip
            *.zip
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          # Update these notes before triggering the next release.
          body: |
            - Se corrigió un error que impedía iniciar IterVC cuando VB-Cable estaba en uso por otra aplicación.
            - Se mejoró la recuperación del micrófono cuando Windows bloquea el dispositivo de audio.
            - Se añadieron avisos en los registros y se permite reintentar el audio sin reiniciar la aplicación.
            - Se corrigieron fallos al usar los controles de audio después de un error de inicialización.
            - Se añadió una versión portable para Windows x64: el ZIP incluye un único archivo IterVC.exe.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
