name: Publicación de Versión (Firma y Release)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    env:
      RELEASE_VERSION: v1.0.${{ github.run_number }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Compilar, Firmar y Empaquetar
        shell: pwsh
        env:
          MY_GITHUB_SECRET_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          ./.deploys/BUILD_AND_SIGN.ps1

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *-Windows.zip
            *.zip
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          # Update these notes before triggering the next release.
          body: |
            - Se añadió supresión de ruido experimental con RNNoise, activable desde los ajustes del micrófono.
            - Se mejoró el procesamiento del micrófono para aplicar la supresión antes de la puerta de ruido y el control de ganancia.
            - Se unificó el audio que reciben la monitorización, los medidores de nivel y VB-Cable.
            - Se añadió procesamiento de ruido en segundo plano para no bloquear la captura del micrófono.
            - Se incorporó recuperación del audio sin supresión si RNNoise deja de estar disponible.
            - Se integró RNNoise en la versión portable para Windows x64, sin descargar modelos adicionales.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
