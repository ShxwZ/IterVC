name: Rust PCM buffers — C# equivalence and comparative benchmarks

on:
  push:
    branches:
      - perf/rust-pcm-buffers-benchmarks
    paths:
      - 'native/iter_vc_buffers/**'
      - 'benchmarks/IterVC.BufferBenchmarks/**'
      - 'benchmarks/IterVC.WasapiAB/**'
      - '.github/workflows/rust-pcm-buffers-benchmarks.yml'
      - 'IterVC.Audio/Buffers/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: C# vs Rust (+ FFI) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust correctness tests (FIFO, overflow, correction, silence, C ABI)
        run: cargo test --manifest-path native/iter_vc_buffers/Cargo.toml --all-targets --verbose
      - name: Test all Rust synchronization and copy variants
        run: cargo test --manifest-path native/iter_vc_buffers/Cargo.toml --all-features --all-targets
      - name: Build all Rust release variants for a same-runner comparison
        shell: pwsh
        run: |
          $manifest = "native/iter_vc_buffers/Cargo.toml"
          $variants = @(
            @{ Name = "std"; Features = "" },
            @{ Name = "std-fast"; Features = "fastcopy" },
            @{ Name = "parking"; Features = "parking" },
            @{ Name = "parking-fast"; Features = "parking,fastcopy" }
          )
          foreach ($v in $variants) {
            $features = if ($v.Features -eq "") { @() } else { @("--features", $v.Features) }
            cargo build --manifest-path $manifest --release --target-dir "native/iter_vc_buffers/target/$($v.Name)" @features
            if ($LASTEXITCODE -ne 0) { throw "Rust build failed: $($v.Name)" }
          }
      - name: Compile exact production C# ring as the benchmark baseline
        run: dotnet build benchmarks/IterVC.BufferBenchmarks/IterVC.BufferBenchmarks.csproj --configuration Release
      - name: Verify cross-language byte/counter equivalence and measure throughput
        shell: pwsh
        run: |
          $binaryDir = "benchmarks/IterVC.BufferBenchmarks/bin/Release/net8.0"
          $nativeName = if ($IsWindows) { "iter_vc_buffers.dll" } else { "libiter_vc_buffers.so" }
          # Two rounds with reversed order reduce thermal and runner drift.
          for ($round = 0; $round -lt 2; $round++) {
            if ($round -eq 0) {
              $variants = @("std", "std-fast", "parking", "parking-fast")
            } else {
              $variants = @("parking-fast", "parking", "std-fast", "std")
            }
            foreach ($variant in $variants) {
              $native = "native/iter_vc_buffers/target/$variant/release/$nativeName"
              if (-not (Test-Path $native)) { throw "Native Rust library missing: $native" }
              Copy-Item -LiteralPath $native -Destination $binaryDir -Force
              $destination = "bench-results/pass-$round/$variant"
              dotnet run --project benchmarks/IterVC.BufferBenchmarks/IterVC.BufferBenchmarks.csproj --configuration Release --no-build -- $destination 40000 $variant
              if ($LASTEXITCODE -ne 0) { throw "Parity/stress/benchmark failed: $variant, pass $round" }
            }
          }
          python benchmarks/summarize_variants.py bench-results
          if ($LASTEXITCODE -ne 0) { throw "Variant aggregator failed." }
          Get-Content bench-results/leaderboard.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Publish Windows real WASAPI A/B probe (hardware is NOT available in CI)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish benchmarks/IterVC.WasapiAB/IterVC.WasapiAB.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o wasapi-ab-portable
          if ($LASTEXITCODE -ne 0) { throw "WASAPI probe failed to publish." }
          Copy-Item -LiteralPath native/iter_vc_buffers/target/std/release/iter_vc_buffers.dll -Destination wasapi-ab-portable/iter_vc_buffers.dll -Force
          & wasapi-ab-portable/IterVC.WasapiAB.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "WASAPI probe C#/Rust parity self-test failed." }
          & wasapi-ab-portable/IterVC.WasapiAB.exe --help
          if ($LASTEXITCODE -ne 0) { throw "WASAPI probe help failed." }
      - name: Upload opt-in Windows physical microphone A/B probe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: itervc-wasapi-ab-hardware-win-x64
          path: wasapi-ab-portable/
          if-no-files-found: error
          retention-days: 14
      - name: Upload per-platform results with raw trial times
        uses: actions/upload-artifact@v4
        with:
          name: pcm-buffer-benchmarks-${{ matrix.os }}
          path: bench-results/
          if-no-files-found: error
          retention-days: 14
