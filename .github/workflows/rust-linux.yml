name: Rust buffers and Linux PipeWire prototype

on:
  pull_request:
    branches: [master]
    paths:
      - 'rust/**'
      - 'IterVC.Linux/**'
      - 'native/iter_vc_rnnoise/**'
      - '.devcontainer/**'
      - 'IterVC.Core/**'
      - '.github/workflows/rust-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-native:
    name: Linux Rust build and PCM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate private Codespaces browser desktop configuration
        run: |
          set -euo pipefail
          bash -n .devcontainer/build-linux.sh
          bash -n .devcontainer/start-browser-preview.sh
          bash -n .devcontainer/desktop-session.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path(".devcontainer/devcontainer.json").read_text())
          assert config["forwardPorts"] == [6080]
          assert config["portsAttributes"]["6080"]["onAutoForward"] == "openBrowser"
          assert "private" in config["portsAttributes"]["6080"]["label"].lower()
          assert "build-linux.sh" in config["postCreateCommand"]
          assert "start-browser-preview.sh" in config["postStartCommand"]
          assert config["features"]["ghcr.io/devcontainers/features/dotnet:2"]["version"] == "8.0"
          shell = Path(".devcontainer/desktop-session.sh").read_text()
          assert "127.0.0.1:6080" in shell and "127.0.0.1:5900" in shell
          assert "-localhost -nopw" in shell
          assert "0.0.0.0:6080" not in shell
          assert Path(".devcontainer/README.md").is_file()
          PY
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust unit tests and PCM transport integration
        run: cargo test --locked --manifest-path rust/Cargo.toml --workspace --all-targets
      - name: Build experimental Linux PipeWire command
        run: cargo build --locked --manifest-path rust/Cargo.toml -p itervc-linux-pipewire --release
      - name: Build same native RNNoise library used by Windows
        run: |
          cargo build --manifest-path native/iter_vc_rnnoise/Cargo.toml --release
          cp native/iter_vc_rnnoise/target/release/libiter_vc_rnnoise.so rust/target/release/
          test -s rust/target/release/libiter_vc_rnnoise.so
      - name: Smoke test Linux CLI without a PipeWire session
        run: ./rust/target/release/itervc-linux-pipewire --help
      - name: Setup .NET 8 for Linux desktop preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Linux portable desktop application
        run: |
          dotnet publish IterVC.Linux/IterVC.Linux.csproj -c Release -r linux-x64             --self-contained true -p:PublishSingleFile=true             -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugSymbols=false             -p:DebugType=None -o artifacts/linux-desktop
          test -f artifacts/linux-desktop/IterVC.Linux
      - name: Headless GUI/backend smoke test
        run: ./artifacts/linux-desktop/IterVC.Linux --self-test
      - name: Install Xvfb and desktop rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth xdotool libfontconfig1 libice6 libsm6
      - name: Interact with Linux desktop and hotkeys on virtual X11
        shell: bash
        run: timeout --signal=TERM 20s xvfb-run -a bash rust/scripts/gui-xvfb-smoke.sh ./artifacts/linux-desktop/IterVC.Linux
      - name: Package Linux portable executable with Unix permissions
        run: |
          chmod 755 artifacts/linux-desktop/IterVC.Linux
          tar -czf artifacts/IterVC-Linux-Desktop-portable-x64.tar.gz \
            -C artifacts/linux-desktop IterVC.Linux
          mkdir -p /tmp/itervc-extraction
          tar -xzf artifacts/IterVC-Linux-Desktop-portable-x64.tar.gz \
            -C /tmp/itervc-extraction
          test -x /tmp/itervc-extraction/IterVC.Linux
          /tmp/itervc-extraction/IterVC.Linux --self-test
      - name: Upload Linux desktop tarball (preserves executable permission)
        uses: actions/upload-artifact@v4
        with:
          name: IterVC-Linux-Desktop-portable-tarball-x64
          path: artifacts/IterVC-Linux-Desktop-portable-x64.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Upload portable Linux desktop preview
        uses: actions/upload-artifact@v4
        with:
          name: IterVC-Linux-Desktop-portable-x64
          path: artifacts/linux-desktop/IterVC.Linux
          if-no-files-found: error
          retention-days: 7
      - name: Upload experimental Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: IterVC-Linux-PipeWire-prototype-x64
          path: rust/target/release/itervc-linux-pipewire
          if-no-files-found: error
          retention-days: 7

  linux-pipewire-server:
    name: Real headless PipeWire virtual microphone lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install PipeWire, pipewire-pulse and pactl
        run: |
          sudo apt-get update
          sudo apt-get install -y pipewire pipewire-pulse pipewire-bin pulseaudio-utils dbus-user-session
      - name: Build Rust Linux backend
        run: cargo build --locked --manifest-path rust/Cargo.toml -p itervc-linux-pipewire --release
      - name: Build same native RNNoise library used by Windows
        run: |
          cargo build --manifest-path native/iter_vc_rnnoise/Cargo.toml --release
          cp native/iter_vc_rnnoise/target/release/libiter_vc_rnnoise.so rust/target/release/
          test -s rust/target/release/libiter_vc_rnnoise.so
      - name: Setup .NET 8 for graphical PipeWire integration
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install virtual X11 and keyboard interaction tools
        run: |
          sudo apt-get install -y xvfb xauth xdotool libfontconfig1 libice6 libsm6
      - name: Build self-contained Linux desktop for integration
        run: |
          dotnet publish IterVC.Linux/IterVC.Linux.csproj -c Release -r linux-x64 \
            --self-contained true -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugSymbols=false \
            -p:DebugType=None -o artifacts/pipewire-desktop
      - name: Test actual PipeWire daemon with CLI and Avalonia GUI (X11)
        run: |
          timeout --signal=TERM 100s xvfb-run -a dbus-run-session -- \
            bash rust/scripts/pipewire-integration.sh \
              ./rust/target/release/itervc-linux-pipewire \
              ./artifacts/pipewire-desktop/IterVC.Linux

  windows-native:
    name: Windows Rust buffer compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test pure Rust buffer on Windows
        run: cargo test --locked --manifest-path rust/Cargo.toml -p itervc-audio-buffers
      - name: Build Windows buffer library
        run: cargo build --locked --manifest-path rust/Cargo.toml -p itervc-audio-buffers --release
