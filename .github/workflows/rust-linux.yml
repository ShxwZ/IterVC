name: Rust buffers and Linux PipeWire prototype

on:
  pull_request:
    branches: [master]
    paths:
      - 'rust/**'
      - 'IterVC.Linux/**'
      - 'IterVC.Core/**'
      - '.github/workflows/rust-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-native:
    name: Linux Rust build and PCM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust unit tests and PCM transport integration
        run: cargo test --locked --manifest-path rust/Cargo.toml --workspace --all-targets
      - name: Build experimental Linux PipeWire command
        run: cargo build --locked --manifest-path rust/Cargo.toml -p itervc-linux-pipewire --release
      - name: Smoke test Linux CLI without a PipeWire session
        run: ./rust/target/release/itervc-linux-pipewire --help
      - name: Setup .NET 8 for Linux desktop preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Linux portable desktop application
        run: |
          dotnet publish IterVC.Linux/IterVC.Linux.csproj -c Release -r linux-x64             --self-contained true -p:PublishSingleFile=true             -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugSymbols=false             -p:DebugType=None -o artifacts/linux-desktop
          test -f artifacts/linux-desktop/IterVC.Linux
      - name: Headless GUI/backend smoke test
        run: ./artifacts/linux-desktop/IterVC.Linux --self-test
      - name: Install Xvfb and desktop rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libfontconfig1 libice6 libsm6
      - name: Smoke test Avalonia Linux window under a virtual X11 display
        shell: bash
        run: |
          set +e
          timeout --signal=TERM 6s xvfb-run -a ./artifacts/linux-desktop/IterVC.Linux > /tmp/itervc-xvfb.log 2>&1
          result=$?
          set -e
          cat /tmp/itervc-xvfb.log
          if [ "$result" -ne 124 ]; then
            echo "Linux GUI exited unexpectedly (exit code: $result)" >&2
            exit 1
          fi
      - name: Package Linux portable executable with Unix permissions
        run: |
          chmod 755 artifacts/linux-desktop/IterVC.Linux
          tar -czf artifacts/IterVC-Linux-Desktop-portable-x64.tar.gz \
            -C artifacts/linux-desktop IterVC.Linux
          mkdir -p /tmp/itervc-extraction
          tar -xzf artifacts/IterVC-Linux-Desktop-portable-x64.tar.gz \
            -C /tmp/itervc-extraction
          test -x /tmp/itervc-extraction/IterVC.Linux
          /tmp/itervc-extraction/IterVC.Linux --self-test
      - name: Upload Linux desktop tarball (preserves executable permission)
        uses: actions/upload-artifact@v4
        with:
          name: IterVC-Linux-Desktop-portable-tarball-x64
          path: artifacts/IterVC-Linux-Desktop-portable-x64.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Upload portable Linux desktop preview
        uses: actions/upload-artifact@v4
        with:
          name: IterVC-Linux-Desktop-portable-x64
          path: artifacts/linux-desktop/IterVC.Linux
          if-no-files-found: error
          retention-days: 7
      - name: Upload experimental Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: IterVC-Linux-PipeWire-prototype-x64
          path: rust/target/release/itervc-linux-pipewire
          if-no-files-found: error
          retention-days: 7

  linux-pipewire-server:
    name: Real headless PipeWire virtual microphone lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install PipeWire, pipewire-pulse and pactl
        run: |
          sudo apt-get update
          sudo apt-get install -y pipewire pipewire-pulse pipewire-bin pulseaudio-utils dbus-user-session
      - name: Build Rust Linux backend
        run: cargo build --locked --manifest-path rust/Cargo.toml -p itervc-linux-pipewire --release
      - name: Test real PipeWire daemon with synthetic microphone
        run: dbus-run-session -- bash rust/scripts/pipewire-integration.sh

  windows-native:
    name: Windows Rust buffer compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test pure Rust buffer on Windows
        run: cargo test --locked --manifest-path rust/Cargo.toml -p itervc-audio-buffers
      - name: Build Windows buffer library
        run: cargo build --locked --manifest-path rust/Cargo.toml -p itervc-audio-buffers --release
