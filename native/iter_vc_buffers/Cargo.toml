[package]
name = "iter_vc_buffers"
version = "0.1.0"
edition = "2021"
publish = false
description = "Isolated C-ABI PCM ring buffer prototype for fair C# vs Rust benchmarks"

[features]
default = []
parking = ["dep:parking_lot"]
fastcopy = []

[dependencies]
parking_lot = { version = "0.12", optional = true }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
